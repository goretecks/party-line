name: Build Windows exe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build PartyLine.exe
        run: pyinstaller --noconfirm --clean PartyLine.spec

      - name: Self-test the exe on Windows
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\PartyLine.exe -ArgumentList '--selftest' -Wait -PassThru
          Get-Content "$env:APPDATA\VOIP Translator\translator.log"
          if ($p.ExitCode -ne 0) { throw "self-test failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: PartyLine
          path: dist/PartyLine.exe

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${GITHUB_RUN_NUMBER}" dist/PartyLine.exe \
            --title "Party Line (build ${GITHUB_RUN_NUMBER})" \
            --notes-file .github/release-notes.md --latest
